name: 回复力量训练相关
depend_ctx_key:
  - intent_analyze_result
match_condition: "'力量训练' in ctx.get('intent_analyze_result.intent')"
prompt: |
  请针对力量训练给出专业的训练计划。用户的诉求是：{{ intent_analyze_result.intent }}，用户潜在需求是：{{ intent_analyze_result.potential_need }} ， 用户画像特征是：{{ intent_analyze_result.feature }}

prompt_detail:

tool: LLMCallTool
tool_params:
  ctx:
    - user_input
    - system_prompt
    - intent_analyze_result.intent
    - intent_analyze_result.potential_need
    - intent_analyze_result.feature
  config:
    - prompt
    - prompt_detail
  extra: {}
tool_result_target: DIRECT_RETURN
tool_result_key:
